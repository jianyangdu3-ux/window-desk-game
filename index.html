<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>同人文小游戏 · 考研单词融合版 v5.3</title>
<style>
  :root{
    --paper:#f6eddb; --paper2:#efe2ca; --cream:#fffaf0;
    --ink:#403725; --ink2:#6c5f49; --dim:#9b8a6e;
    --orange:#dd924e; --orange-d:#c2763a;
    --green:#5f8466; --rose:#c87a83; --gold:#d6a23f;
    --bg1:#f4ead6; --bg2:#e9d9bd;
    --he:#5f8466; --be:#c87a83;
    --panel:rgba(255,250,240,.72); --line:rgba(95,70,40,.16);
    --shadow:0 12px 34px rgba(120,90,50,.14); --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:radial-gradient(120% 120% at 50% 0%,var(--bg2),var(--bg1));
    color:var(--ink); display:flex; justify-content:center; padding:24px 16px; min-height:100vh;}
  .app{width:100%; max-width:580px;}
  h1{font-size:21px; text-align:center; font-weight:700; letter-spacing:1px;
     background:linear-gradient(90deg,var(--gold),var(--rose));
     -webkit-background-clip:text; background-clip:text; color:transparent;}
  .sub{text-align:center; color:var(--dim); font-size:12.5px; margin-top:6px; margin-bottom:12px; line-height:1.6}
  .topbar{display:flex; gap:8px; margin-bottom:12px;}
  .topbar button{flex:1; background:var(--panel); border:1px solid var(--line); color:var(--dim);
     padding:9px; border-radius:10px; cursor:pointer; font-size:12.5px; transition:.18s;}
  .topbar button.on{border-color:var(--gold); color:var(--gold); background:rgba(244,201,93,.12);}
  .scale{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:12px;}
  .scale .lab{display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin-bottom:8px;}
  .scale .lab b{color:var(--he)} .scale .lab i{color:var(--be); font-style:normal}
  .track{position:relative; height:10px; border-radius:99px; background:linear-gradient(90deg,var(--be),#5a4a7a,var(--he));}
  .needle{position:absolute; top:-4px; width:4px; height:18px; border-radius:99px; background:#fff; box-shadow:0 0 10px #fff; transform:translateX(-50%); transition:left .5s cubic-bezier(.4,1.4,.5,1);}
  .scale .hint{text-align:center; font-size:12px; color:var(--dim); margin-top:8px; min-height:16px;}
  .scene{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px; min-height:180px; animation:fade .4s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
  .who{font-size:12px; color:var(--gold); letter-spacing:1px; margin-bottom:10px;}
  .txt{font-size:15px; line-height:1.85; white-space:pre-wrap;}
  .stats{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; font-size:12px; color:var(--dim)}
  .stats span{background:rgba(255,255,255,.05); padding:4px 10px; border-radius:99px; border:1px solid var(--line)}
  .wordcard{margin:14px 0; padding:16px; border-radius:14px; text-align:center;
            background:linear-gradient(135deg,rgba(244,201,93,.16),rgba(232,127,168,.16)); border:1px solid var(--line);}
  .wordcard .en{font-size:26px; font-weight:700; letter-spacing:1px;}
  .wordcard .ph{font-size:13px; color:var(--dim); margin-top:4px;}
  .wordcard .zh{font-size:14px; color:var(--ink); margin-top:6px;}
  .blank{display:inline-block; min-width:74px; text-align:center; padding:1px 6px; margin:0 2px;
     font-weight:700; color:var(--gold-d); letter-spacing:2px; border-bottom:2px dashed var(--gold);
     background:linear-gradient(180deg,transparent 55%, rgba(244,201,93,.28) 55%); border-radius:3px;}
  .qtype{display:inline-block; font-size:11px; color:var(--gold); border:1px solid var(--line);
     padding:2px 9px; border-radius:99px; margin-bottom:10px;}
  .speak{display:flex; align-items:center; gap:6px; background:rgba(95,132,102,.12);
     border:1px solid rgba(95,132,102,.35); color:var(--green); padding:8px 14px; border-radius:10px;
     cursor:pointer; font-size:14px; margin:6px auto; width:fit-content;}
  .choices{margin-top:14px; display:flex; flex-direction:column; gap:9px;}
  .choice{background:linear-gradient(135deg,rgba(244,201,93,.12),rgba(232,127,168,.12));
          border:1px solid var(--line); color:var(--ink); text-align:left; padding:12px 15px;
          border-radius:12px; font-size:14px; cursor:pointer; transition:.18s; line-height:1.5;}
  .choice:hover:not(:disabled){border-color:var(--gold); transform:translateX(3px);}
  .choice:disabled{cursor:default; opacity:.55;}
  .choice.ok{border-color:var(--he); background:rgba(123,224,192,.18); opacity:1;}
  .fav-btn{background:linear-gradient(135deg,rgba(244,201,93,.18),rgba(232,127,168,.18)); border-color:var(--gold);}
  .fav-btn.fav-on{background:linear-gradient(135deg,rgba(232,127,168,.32),rgba(244,201,93,.28)); border-color:var(--pink-d); color:var(--pink-d); font-weight:700;}
  .choice.no{border-color:var(--be); background:rgba(199,125,255,.18); opacity:1;}
  .qinput{width:100%; background:rgba(0,0,0,.25); border:1px solid var(--line); color:var(--ink);
     padding:12px 14px; border-radius:10px; font-size:16px; margin-top:8px; outline:none;}
  .qinput:focus{border-color:var(--gold);}
  .qbtn{margin-top:10px; background:linear-gradient(90deg,var(--gold),var(--rose)); border:none;
     color:#2a1c44; font-weight:700; padding:11px 18px; border-radius:10px; cursor:pointer; font-size:14px;}
  .qbtn:hover{filter:brightness(1.08)}
  .fb{margin-top:12px; font-size:13px; text-align:center; min-height:18px;}
  .fb.good{color:var(--he)} .fb.bad{color:var(--be)}
  .mode{display:flex; gap:7px; margin-bottom:12px; flex-wrap:wrap;}
  .mode button{flex:1; min-width:64px; background:var(--panel); border:1px solid var(--line); color:var(--ink); padding:9px; border-radius:10px; cursor:pointer; font-size:12px; transition:.18s;}
  .mode button.on{border-color:var(--gold); background:rgba(244,201,93,.15); color:var(--gold);}
  .card{display:block; width:100%; text-align:left; background:var(--panel); border:1px solid var(--line);
     color:var(--ink); padding:16px; border-radius:14px; cursor:pointer; margin-bottom:10px; transition:.18s;}
  .card:hover{border-color:var(--gold); transform:translateY(-2px);}
  .card h3{font-size:16px; margin-bottom:5px; color:var(--gold);}
  .card p{font-size:12.5px; color:var(--dim); line-height:1.6;}
  .card .badge{display:inline-block; font-size:11px; color:var(--he); border:1px solid rgba(123,224,192,.4); padding:1px 8px; border-radius:99px; margin-bottom:6px;}
  .ending{border-radius:16px; padding:22px; animation:fade .5s ease; text-align:center;}
  .ending.he{background:linear-gradient(160deg,rgba(123,224,192,.18),rgba(244,201,93,.12)); border:1px solid rgba(123,224,192,.4)}
  .ending.be{background:linear-gradient(160deg,rgba(199,125,255,.18),rgba(232,127,168,.12)); border:1px solid rgba(199,125,255,.4)}
  .ending .tag{font-size:13px; letter-spacing:3px; opacity:.85}
  .ending h2{font-size:23px; margin:8px 0 14px;}
  .ending p{font-size:14px; line-height:1.85; white-space:pre-wrap; text-align:left;}
  .restart{margin-top:18px; width:100%; background:linear-gradient(90deg,var(--gold),var(--rose)); border:none; color:#2a1c44; font-weight:700; padding:13px; border-radius:12px; cursor:pointer; font-size:15px;}
  .restart:hover{filter:brightness(1.08)}
  .foot{text-align:center; color:var(--dim); font-size:11px; margin-top:14px; line-height:1.6}
  textarea{width:100%; min-height:90px; background:rgba(0,0,0,.25); border:1px solid var(--line); color:var(--ink);
     padding:10px; border-radius:10px; font-size:13px; outline:none; font-family:inherit;}
  .prog{display:flex; gap:16px; margin:12px 0; flex-wrap:wrap; font-size:12px; color:var(--ink2)}
  .prog .stat{ display:flex; align-items:baseline; gap:5px; }
  .prog .stat b{ font-size:17px; color:var(--orange-d); font-weight:700; }
  /* ===== 暖色纸感 · 新增组件 & 浅色适配覆盖 ===== */
  body{ background:radial-gradient(140% 100% at 50% -8%, #fbf3e2, #f1e3c8 58%, #e7d4b2) fixed; color:var(--ink); }
  .app{ max-width:600px; }
  h1{ font-family:"Songti SC","Noto Serif SC","STSong","Source Han Serif SC",serif; font-size:25px; font-weight:700; letter-spacing:2px; color:var(--ink); -webkit-background-clip:initial; background:none; }
  .sub{ color:var(--ink2); }
  .topbar{ gap:6px; margin-bottom:14px; }
  .topbar button{ flex:1; background:var(--panel); border:1px solid var(--line); color:var(--ink2); padding:9px 6px; border-radius:11px; cursor:pointer; font-size:12.5px; transition:.18s; font-weight:600; }
  .topbar button.on{ border-color:var(--orange); color:#fff; background:linear-gradient(135deg,var(--orange),var(--orange-d)); box-shadow:0 6px 16px rgba(210,120,60,.25); }
  .scene{ box-shadow:var(--shadow); background:linear-gradient(180deg,rgba(255,251,243,.92),rgba(255,248,236,.84)); border-color:rgba(95,70,40,.14); }
  .card{ box-shadow:var(--shadow); background:linear-gradient(180deg,rgba(255,251,243,.94),rgba(255,247,233,.86)); border-color:rgba(95,70,40,.14); }
  .card:hover{ border-color:var(--orange); box-shadow:0 16px 36px rgba(120,90,50,.18); }
  .card h3{ color:var(--orange-d); }
  .who{ color:var(--orange-d); }
  .qtype{ color:var(--orange-d); border-color:rgba(221,146,78,.4); }
  .scale{ background:linear-gradient(180deg,rgba(255,251,243,.92),rgba(255,248,236,.84)); border-color:rgba(95,70,40,.14); box-shadow:var(--shadow); }
  .scale .track{ background:linear-gradient(90deg,var(--rose),#e6d6b8,var(--green)); }
  .needle{ background:var(--ink); box-shadow:0 0 8px rgba(64,55,37,.45); top:-3px; height:16px; }
  .qinput{ background:rgba(120,95,60,.07); border:1px solid var(--line); color:var(--ink); }
  .qinput:focus{ border-color:var(--orange); }
  textarea{ background:rgba(120,95,60,.07); border:1px solid var(--line); color:var(--ink); }
  .prog span, .stats span{ background:rgba(120,95,60,.08); }
  .ending.he{ background:linear-gradient(160deg,rgba(95,132,102,.2),rgba(214,162,63,.14)); border-color:rgba(95,132,102,.5); }
  .ending.be{ background:linear-gradient(160deg,rgba(200,122,131,.2),rgba(232,127,168,.14)); border-color:rgba(200,122,131,.5); }
  .foot{ color:var(--dim); }
  .cover{ text-align:center; min-height:calc(100vh - 48px); display:flex; flex-direction:column; justify-content:center; padding:24px 20px; }
  .cover .kicker{ font-size:11.5px; letter-spacing:5px; color:var(--orange-d); font-weight:700; margin-bottom:6px; }
  .cover h1{ font-size:33px; margin:16px 0 4px; }
  .cover .ruleline{ width:72px; height:2px; background:linear-gradient(90deg,var(--orange),var(--rose)); margin:18px auto; border-radius:2px; }
  .cover .tagline{ color:var(--ink2); font-size:13.5px; line-height:1.95; margin:10px auto 22px; max-width:440px; }
  .cover .heroline{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin:6px 0 28px; }
  .cover .heroline span{ font-size:11.5px; color:var(--dim); background:rgba(255,251,243,.7); border:1px solid rgba(95,70,40,.12); padding:5px 12px; border-radius:99px; }
  .cover .cta{ display:flex; flex-direction:column; gap:12px; max-width:280px; margin:0 auto; }
  .btn-primary{ background:linear-gradient(135deg,var(--orange),var(--orange-d)); color:#fff; border:none; font-weight:700; padding:15px; border-radius:14px; cursor:pointer; font-size:15px; box-shadow:0 10px 24px rgba(210,120,60,.3); transition:.18s; }
  .btn-primary:hover{ filter:brightness(1.05); transform:translateY(-1px); }
  .btn-ghost{ background:var(--panel); border:1px solid var(--line); color:var(--ink2); padding:13px; border-radius:14px; cursor:pointer; font-size:14px; transition:.18s; }
  .btn-ghost:hover{ border-color:var(--orange); color:var(--orange-d); }
  .cover .progressline{ margin-top:26px; font-size:12px; color:var(--dim); }
  .today{ background:linear-gradient(135deg,rgba(221,146,78,.16),rgba(95,132,102,.14)); border:1px solid rgba(221,146,78,.35); border-radius:var(--radius); padding:16px; margin-bottom:14px; box-shadow:var(--shadow); }
  .grp{ font-family:"Songti SC","Noto Serif SC",serif; font-size:13px; font-weight:700; color:var(--orange-d); letter-spacing:2px; margin:18px 2px 8px; display:flex; align-items:center; gap:8px; }
  .grp::after{ content:""; flex:1; height:1px; background:linear-gradient(90deg,rgba(221,146,78,.4),transparent); }
  .sec-title{ font-family:"Songti SC","Noto Serif SC",serif; font-size:13px; font-weight:700; color:var(--orange-d); letter-spacing:2px; margin:16px 2px 8px; }
  .pack-chips{ display:flex; flex-wrap:wrap; gap:7px; margin:2px 0 0; }
  .chip{ font-size:12.5px; padding:4px 11px; border-radius:999px; background:rgba(221,146,78,.14); border:1px solid rgba(221,146,78,.4); color:var(--ink); }
  .chip-ghost{ background:transparent; border:1px dashed rgba(60,67,60,.3); color:var(--dim); }
  .field{ margin:9px 0; }
  .field label{ display:block; font-size:12px; color:var(--dim); margin-bottom:4px; }
  .field .qinput{ width:100%; box-sizing:border-box; padding:8px 10px; font-size:13px; }
  .today .tl{ font-size:12px; letter-spacing:2px; color:var(--orange-d); font-weight:700; margin-bottom:8px; }
  .today .tstats{ display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 12px; }
  .today .tstats span{ background:rgba(255,255,255,.6); border:1px solid var(--line); color:var(--ink2); font-size:12px; padding:5px 11px; border-radius:99px; }
  .today .tip{ font-size:12.5px; color:var(--ink2); line-height:1.7; margin-bottom:4px; }
  .chars{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:6px; }
  .char{ background:linear-gradient(180deg,rgba(255,251,243,.96),rgba(255,247,233,.9)); border:1px solid var(--line); border-radius:var(--radius); padding:16px; text-align:center; box-shadow:var(--shadow); }
  .char svg{ width:82px; height:82px; display:block; margin:0 auto; }
  .zface{ display:flex; justify-content:center; margin:8px 0 2px; } .zface svg{ width:86px; height:86px; display:block; }
  .char h3{ font-family:"Songti SC","Noto Serif SC",serif; font-size:18px; margin:8px 0 2px; color:var(--ink); }
  .char .role{ font-size:11.5px; color:var(--orange-d); margin-bottom:8px; letter-spacing:1px; }
  .char p{ font-size:12px; color:var(--ink2); line-height:1.7; text-align:left; }
  .char .traits{ display:flex; gap:5px; flex-wrap:wrap; justify-content:center; margin-top:8px; }
  .char .traits span{ font-size:10.5px; color:var(--green); border:1px solid rgba(95,132,102,.4); padding:2px 7px; border-radius:99px; }
  .ach{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px; }
  .badge{ border:1px solid var(--line); border-radius:13px; padding:13px; background:var(--panel); text-align:center; box-shadow:var(--shadow); }
  .badge .ic{ font-size:22px; }
  .badge .nm{ font-size:13.5px; font-weight:700; margin-top:4px; color:var(--ink); }
  .badge .ds{ font-size:11px; color:var(--ink2); margin-top:3px; line-height:1.5; }
  .badge.locked{ opacity:.5; filter:grayscale(.6); }
  .badge .lock{ font-size:11px; color:var(--dim); margin-top:2px; }
  .about h2{ font-family:"Songti SC","Noto Serif SC",serif; font-size:17px; color:var(--ink); margin:14px 0 6px; }
  .about p, .about li{ font-size:13px; color:var(--ink2); line-height:1.85; }
  .about ul{ padding-left:18px; margin:4px 0; }
  .about .q{ color:var(--orange-d); font-weight:700; }
  /* ===== 设置 / 打字机光标 ===== */
  .linkbtn{ background:none; border:none; color:var(--dim); font-size:12px; cursor:pointer; padding:5px 10px; border-radius:9px; margin-top:4px; transition:.18s; }
  .linkbtn:hover{ color:var(--orange-d); background:rgba(221,146,78,.08); }
  .cover .coverfoot{ margin-top:16px; }
  .tw-c{ color:var(--orange-d); animation:blink 1s step-end infinite; }
  @keyframes blink{ 50%{ opacity:0; } }
  /* ===== 动效 · 入场 · 移动端 · 无障碍 ===== */
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
  .choice.ok{ animation:pop .45s ease; }
  @keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .choice.no{ animation:shakeX .5s ease; }
  .wordcard.ok{ animation:pop .45s ease; box-shadow:0 0 0 2px var(--he) inset, var(--shadow); }
  .wordcard.no{ animation:shakeX .5s ease; box-shadow:0 0 0 2px var(--be) inset, var(--shadow); }
  @keyframes rise{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
  .scene{ animation:rise .5s ease both; }
  .cover>*{ animation:rise .6s ease both; }
  .cover .kicker{ animation-delay:.02s } .cover h1{ animation-delay:.08s } .cover .ruleline{ animation-delay:.14s } .cover .tagline{ animation-delay:.2s } .cover .heroline{ animation-delay:.26s } .cover .cta{ animation-delay:.32s } .cover .progressline{ animation-delay:.4s }
  .card{ animation:rise .45s ease both; }
  .card:nth-of-type(1){ animation-delay:.03s }
  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
  @media (max-width:480px){
    body{ padding:14px 10px; }
    .app{ max-width:100%; }
    h1{ font-size:20px; }
    .cover{ min-height:calc(100vh - 28px); padding:14px 10px; }
    .cover h1{ font-size:26px; }
    .scene{ padding:16px; }
    .card{ padding:13px; }
    .card h3{ font-size:15px; }
    .card p{ font-size:12px; }
    .char svg{ width:70px; height:70px; }
    .char p{ font-size:11px; }
    .wordcard .en{ font-size:23px; }
    .txt{ font-size:14px; }
    .topbar button{ padding:8px 4px; font-size:11.5px; }
    .today{ padding:13px; }
  }
</style>
</head>
<body>
<div class="app">
  <div id="root"></div>
</div>

/* ============ 进度 / 错词本 / 碎片（localStorage） ============ */
const PK='kaoyan_prog_v1';
function loadP(){ try{ const p=JSON.parse(localStorage.getItem(PK)); if(!p) return {words:{},custom:[],fav:[],frag:0,dailyDate:'',visitedWords:[]}; p.words=p.words||{}; p.custom=p.custom||[]; p.fav=p.fav||[]; p.visitedWords=p.visitedWords||[]; return p; }catch(e){ return {words:{},custom:[],fav:[],frag:0,dailyDate:'',visitedWords:[]}; } }
function saveP(p){ try{ localStorage.setItem(PK, JSON.stringify(p)); }catch(e){} }
function getSfx(){ try{ return !!(loadP().sfx); }catch(e){ return false; } }
function setSfx(v){ const p=loadP(); p.sfx=!!v; saveP(p); }
let _actx=null;
function _audio(){ try{ if(!_actx) _actx=new (window.AudioContext||window.webkitAudioContext)(); if(_actx.state==='suspended') _actx.resume(); return _actx; }catch(e){ return null; } }
function _tone(freq, dur, type, gain){ if(!getSfx()) return; const a=_audio(); if(!a) return; const o=a.createOscillator(), g=a.createGain(); o.type=type||'sine'; o.frequency.value=freq; o.connect(g); g.connect(a.destination); const t=a.currentTime; g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(gain||0.05,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.start(t); o.stop(t+dur+0.03); }
function sfxClick(){ _tone(380,0.07,'triangle',0.045); }
function sfxGood(){ _tone(660,0.12,'sine',0.055); setTimeout(function(){ _tone(880,0.16,'sine',0.045); },80); }
function sfxBad(){ _tone(170,0.2,'sawtooth',0.035); }
function record(en, ok){
  const p=loadP();
  if(!p.words[en]) p.words[en]={c:0,w:0,seen:Date.now(),interval:0,due:Date.now(),ease:2.5};
  const r=p.words[en]; const DAY=86400000;
  if(ok){
    r.c++;
    if(r.c===1) r.interval=1;
    else if(r.c===2) r.interval=3;
    else r.interval=Math.max(1, Math.round(r.interval*r.ease));
    r.ease=Math.min(3.0, r.ease); // 答对不降难度
    r.w=Math.max(0,(r.w||0)-1);   // 连续答对，逐渐移出错词本
  } else {
    r.c=0; r.interval=1; r.ease=Math.max(1.3, r.ease-0.2); // 答错重置、降难度
    r.w=(r.w||0)+1;               // 答错累计，进入「他的错题本」
  }
  r.seen=Date.now(); r.due=r.seen+r.interval*DAY; // 下次到期=现在+间隔天
  saveP(p);
}
function stat(){ const p=loadP(); let mastered=0, wrong=0;
  for(const k in p.words){ const w=p.words[k]; if(w.c>=3 && w.w===0) mastered++; if(w.w>0) wrong++; }
  return {mastered, wrong, total:Object.keys(p.words).length};
}
function findWord(en){ return BANK.find(w=>w[0]===en); }
function unmastered(){ const p=loadP(); return BANK.filter(w=>{const r=p.words[w[0]]; return !r||r.c<3;}); }
function dueCount(){ const p=loadP(); const n=Date.now(); let k=0; for(const e in p.words){ const r=p.words[e]; if(r.c>0 && r.due && r.due<=n) k++; } return k; }
function dueCandidates(n, base){
  const p=loadP(); const now=Date.now(); const src=base||BANK;
  // 候选：未掌握(c<3)，或已掌握但到期需复习(due<=now)
  const cand=src.filter(w=>{ const r=p.words[w[0]]; return !r || r.c<3 || (r.due && r.due<=now); });
  cand.sort((a,b)=>{ const ra=p.words[a[0]]||{due:0}; const rb=p.words[b[0]]||{due:0}; return (ra.due||0)-(rb.due||0); });
  return cand.slice(0,n);
}
function todayKey(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }

function markWord(en){ if(!en) return; const p=loadP(); p.visitedWords=p.visitedWords||[]; if(p.visitedWords.indexOf(en)<0){ p.visitedWords.push(en); saveP(p); } }

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function distract(en){
  const cor=findWord(en)?findWord(en)[2]:'';
  const arr=[]; let g=0;
  while(arr.length<3 && g++<80){ const w=BANK[Math.floor(Math.random()*BANK.length)]; if(w[2]!==cor && !arr.includes(w[2])) arr.push(w[2]); }
  return arr;
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function typeWrite(){
  try{
    const els=document.querySelectorAll('.txt.tw:not(.tw-done)');
    const reduce = (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    els.forEach(function(el){
      const full = el.getAttribute('data-tw') || el.textContent;
      el.setAttribute('data-tw', full);
      if(reduce || !('requestAnimationFrame' in window)){ el.textContent=full; el.classList.add('tw-done'); return; }
      el.innerHTML=''; let i=0;
      const speed = full.length>140 ? 6 : 16;
      (function step(){
        if(i<=full.length){
          el.innerHTML = '<span class="tw-t">'+esc(full.slice(0,i))+'</span>'+(i<full.length?'<span class="tw-c">▍</span>':'');
          i++; setTimeout(step, speed);
        } else { el.textContent=full; el.classList.add('tw-done'); }
      })();
    });
  }catch(e){}
}

function exportSave(){
  try{
    const raw = localStorage.getItem(PK) || '{}';
    const obj = JSON.parse(raw);
    const text = JSON.stringify(obj, null, 2);
    const blob = new Blob([text], {type:'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    const pad = n=>(''+n).padStart(2,'0');
    a.href = url;
    a.download = 'window-desk-save_'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'.txt';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }catch(e){ alert('导出失败：'+e.message); }
}
function importSave(ev){
  const f = ev.target.files && ev.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = function(){
    try{
      const obj = JSON.parse(r.result);
      if(typeof obj!=='object' || obj===null || !('words' in obj)){ alert('这不是有效的存档文件'); return; }
      if(!confirm('导入会覆盖当前进度，确定继续？')) return;
      localStorage.setItem(PK, JSON.stringify(obj));
      renderSettings();
    }catch(e){ alert('解析失败：'+e.message); }
  };
  r.readAsText(f);
  ev.target.value='';
}

const GRAPHS={'main':story,'storm':storyStorm,'girl':storyGirl,'both':storyBoth,'grad':storyGrad};
let curStory=story; let curGraph='main';
function scaleHTML(){
  const n=net(); const pct=Math.max(4,Math.min(96,50+n*9));
  let h='你们之间，还看不出什么。（已背 '+reviewed+' 词）';
  if(n>=3) h='他好像比你想的，更在意你一点。（已背 '+reviewed+' 词）';
  else if(n<=-3) h='你们之间，好像隔着点什么。（已背 '+reviewed+' 词）';
  return `<div class="scale"><div class="lab"><b>光明 · HE</b><i>阴影 · BE</i></div><div class="track"><div class="needle" style="left:${pct}%"></div></div><div class="hint">${h}</div></div>`;
}
function sStats(){return `<div class="stats"><span>羁绊 ${s.bond}</span><span>误会 ${s.doubt}</span><span>已背 ${reviewed} 词</span></div>`;}
function refreshScaleStats(){ const sc=document.querySelector('.scale'); if(sc) sc.outerHTML=scaleHTML(); const st=document.querySelector('.stats'); if(st) st.outerHTML=sStats(); }
function shenFluent(){ return (loadP().shenSpoken||0) >= 3; }

function renderStoryStart(){
  curView='story';
  root.innerHTML=`<div class="topbar"><button onclick="renderMenu()">主菜单</button><button onclick="renderDaily()">陪他夜读</button><button onclick="renderStats()">进度</button></div>`
    +`<div class="mode">
      <button class="${mode==='random'?'on':''}" onclick="mode='random';renderStoryStart()">随缘</button>
      <button class="${mode==='he'?'on':''}" onclick="mode='he';renderStoryStart()">指定HE</button>
      <button class="${mode==='be'?'on':''}" onclick="mode='be';renderStoryStart()">指定BE</button></div>`
    + srcBar()
    +`<div class="scene"><div class="who">【开始】</div>      <div class="txt tw">三章主线：你和沈确，两个都不会好好说话的普通考研人。从倒计时的长桌，到出分、复试，再到春天拟录取。\n剧情里夹着些没说出口的暧昧——他耳红、你碰他手背、闭馆那句「别随便说走」。单词关按主题抽词，每章会考一组按本章文意编排、由易到难的「那些词」，和剧情走在一块。答对→偏 HE，答错→偏 BE。\n另有三条<b>番外</b>，都标了发生在主线第几章之后：<b>风波</b>（第三章拟录取之后）——老家发小周屿想把你拉回老家；<b>误会</b>（第一章长桌期间）——同系甜妹林晚喜欢沈确，总点起误会；<b>合流</b>（第三章拟录取之后）——同一周周屿和林晚同框，你被两头将了一军。三场风波里卡住的词，都由你选怎么填。另有 <b>读研后</b>（第三章拟录取之后）——搬进有窗的房，读研日常，把「留下」再考一遍。\n选好模式与词源，开始。</div>
      <div class="choices"><button class="choice" onclick="startStory('main')">▶ 开始主线故事</button><button class="choice" onclick="startStory('storm')">🌊 番外·风波（周屿）</button><button class="choice" onclick="startStory('girl')">🌸 番外·误会（林晚）</button><button class="choice" onclick="startStory('both')">🔥 番外·合流（周屿&林晚）</button><button class="choice" onclick="startStory('grad')">🏠 番外·读研后（有窗的房）</button></div></div>`;
  typeWrite();
}
function startStory(g){ curGraph=g||'main'; curStory=GRAPHS[curGraph]; s={bond:0,doubt:0}; reviewed=0; sceneId=(curGraph==='storm')?'st1':(curGraph==='girl')?'g1':(curGraph==='both')?'b1':'w1'; window._cluster=null; curView='story'; renderScene(sceneId); }
function renderScene(id){
  const sc=curStory[id];
  if(sc.type==='word'){ if(sc.pack) markPack(sc.pack); if(sc.fixed) markWord(sc.fixed); }
  else if(sc.type==='cluster' && sc.packs) sc.packs.forEach(markPack);
  if(sc.type==='word') return askWord((ok)=>{
    if(ok) s.bond+=2; else s.doubt+=1; reviewed++;
    refreshScaleStats();
    const box=document.getElementById('cont'); box.style.display='block';
    const branch = ok ? (sc.right||'') : (sc.wrong||'');
    const col = ok ? 'var(--he)' : 'var(--be)';
    box.innerHTML=`<div class="txt tw" style="font-size:14px;line-height:1.85;margin:4px 0 12px;white-space:pre-wrap;color:${col}">${branch}</div><div class="choices"><button class="choice" onclick="afterWord('${sc.next}')">继续 →</button></div>`;
    typeWrite();
  }, true, sc.pack, sc.fixed, sc);
  if(sc.type==='cluster'){
    // 本章词：优先用脚本里手工编排、按难度递进的词表（与本章文意贴合）；否则从主题包取并按词长(难度)排序，不再随机洗牌
    let pool=[];
    if(sc.words && sc.words.length){
      pool = sc.words.map(en=>findWord(en)).filter(Boolean);
    } else {
      const anchors=['acquaint','persist','confess','endure','express','recall','abandon','tempt','distance','reconcile','attract','jealous','misunderstand','conflict','withdraw','balance'];
      (sc.packs||['general']).forEach(pk=> pool=pool.concat(packList(pk)));
      pool = pool.filter(w=> w[0] && !anchors.includes(w[0])).sort((a,b)=>a[0].length-b[0].length).slice(0, 5+Math.floor(Math.random()*2));
    }
    window._cluster={words:pool, i:0, next:sc.next};
    root.innerHTML=scaleHTML()+`<div class="scene"><div class="who">${sc.who}</div>${(sc.faces?sc.faces.map(f=>'<div class="zface">'+faceSVG(f)+'</div>').join(''):(sc.face?('<div class="zface">'+faceSVG(sc.face)+'</div>'):''))}<div class="txt tw">${sc.text}</div>${sStats()}<div class="choices"><button class="choice" onclick="clusterAsk()">▶ 开始这章的单词（${pool.length} 个）</button><button class="choice" onclick="window._cur=null;renderMenu()">← 返回首页</button></div></div>`;
    typeWrite();
    return;
  }
  if(sc.type==='chapter'){
    const extra = (sc.fluent && shenFluent()) ? '\n'+sc.fluent : '';
    root.innerHTML=scaleHTML()+`<div class="scene"><div class="who">${sc.who}</div>${(sc.faces?sc.faces.map(f=>'<div class="zface">'+faceSVG(f)+'</div>').join(''):(sc.face?('<div class="zface">'+faceSVG(sc.face)+'</div>'):''))}<div class="txt tw">${sc.text}${extra}</div>${sStats()}<div class="choices"><button class="choice" onclick="afterWord('${sc.next}')">继续 →</button><button class="choice" onclick="window._cur=null;renderMenu()">← 返回首页</button></div></div>`;
    typeWrite(); return;
  }
  let ch=sc.choices.map((c,i)=>`<button class="choice" onclick="pick(${i})">${c.t}</button>`).join('');
  const backBtn=`<button class="choice" onclick="window._cur=null;renderMenu()">← 返回首页</button>`;
  root.innerHTML=scaleHTML()+`<div class="scene"><div class="who">${sc.who}</div>${(sc.faces?sc.faces.map(f=>'<div class="zface">'+faceSVG(f)+'</div>').join(''):(sc.face?('<div class="zface">'+faceSVG(sc.face)+'</div>'):''))}<div class="txt tw">${sc.text}</div>${sStats()}<div class="choices">${ch}${backBtn}</div></div>`;
  typeWrite();
}
function pick(i){ const sc=curStory[sceneId]; const c=sc.choices[i]; for(const k in c.fx) s[k]+=c.fx[k]; sceneId=c.next; renderScene(c.next); }
function afterWord(next){ sceneId=next; if(next==='end') renderEnd(); else renderScene(next); }
function clusterAsk(){
  const c=window._cluster;
  if(!c || c.i>=c.words.length){ const nx=c?c.next:'end'; window._cluster=null; afterWord(nx); return; }
  const w=c.words[c.i]; c.i++; markWord(w[0]);
  askWord((ok)=>{
    if(ok) s.bond+=1; reviewed++; refreshScaleStats();
    const box=document.getElementById('cont'); box.style.display='block';
    const last = (c.i>=c.words.length);
    box.innerHTML=`<div class="choices"><button class="choice" onclick="clusterAsk()">${last?'这章的词完了 →':'下一个 →'}</button><button class="choice" onclick="window._cur=null;renderMenu()">← 返回首页</button></div>`;
  }, true, null, w);
}
function renderEnd(){
  const e=(curGraph==='storm')?resolveStorm():(curGraph==='girl')?resolveGirl():(curGraph==='both')?resolveBoth():(curGraph==='grad')?resolveGrad():resolve();
  const p=loadP(); p.cleared=true; saveP(p);
  root.innerHTML=scaleHTML()+`<div class="ending ${e.cls}"><div class="tag">${e.tag}</div><h2>${e.title}</h2><p>${e.body}</p>${sStats()}<div class="choices"><button class="restart" onclick="renderStoryStart()">↺ 换个答法，重玩</button><button class="restart" onclick="renderMenu()">返回首页</button></div></div>`;
}
function resolve(){ if(mode==='he') return he(); if(mode==='be') return be(); return net()>=1?he():be(); }
function he(){
  const p=loadP();
  const sweet = s.doubt<=1;
  const title = sweet ? '考上之后' : '也算是好的';
  let body = sweet
    ? '你答上来了。沈确把那张纸条翻过来，上面是他考前夜撤回的那句：「要是都考上了，要不要一起换个有窗的房子。」\n你忽然想起，自己考前夜也打过一行字，又删了——「要是都考上了，我哪儿都不去。」你没说出口，手却先伸过去，把那支总掉笔帽的笔握住了。\n窗外的天快黑了，你们谁都没急着走。考研的事还没出结果，但那一刻不像在等审判。'
    : '你答得磕磕绊绊，但他没纠正你，只是把纸条收好。「行了，」他说，「意思差不多。」\n你们没说什么动人的话。走出图书馆的时候，他放慢了步子，等你跟上来。';
  if((p.frag||0)>=5){ body += '\n（后来你们真的搬去了一间有窗的房子。他至今不知道，你那晚删掉的那行字，和他在便利贴背面的，是同一句。）'; }
  if(shenFluent()){ body += '\n（他复试那句英文自我介绍，是他自己一个词一个词练出来的——结巴到底熬过去了。）'; }
  if(sweet){ body += '\n（后来你们翻单词本，那些当初卡住的词，都成了只有你们俩懂的暗号。）'; }
  return {tag:'HAPPY END', title, body:body+'（这一路，你顺手复习了 '+reviewed+' 个词）', cls:'he'};
}
function be(){ return {tag:'BAD END', title:'各自南北',
  body:'沈确等了一会儿，把纸条折好放进口袋：「没事，本来也不一定非说。」\n后来你回了老家，按家里意思考了安稳；他去的另一座城市。很多年后你才想起，最后那天他推过来的词是 abandon——大一英语课本上，你发誓要背下来的第一个词。（这一路，你重温了 '+reviewed+' 个词）', cls:'be'}; }
function resolveStorm(){
  const n=net();
  if(n>=3) return {tag:'风波 · 未散', title:'还是你俩', body:'周屿 成了你联系人里一个被删掉的名字。沈确 后来偶尔拿「你当初要是真跟他走了呢」逗你，你「闭嘴」。那场风波没散你们，反倒让你们把没说出口的，都说了一半。窗外的天快黑了，他放慢步子等你——和主线里一样。（这一场风波，你填了 '+reviewed+' 个词）', cls:'he'};
  if(n>=-1) return {tag:'风波 · 余震', title:'裂了道缝', body:'误会说了大半，可那句「你要走就走」像根刺。沈确 没再提周屿，只是留位子时，多留了半寸距离。你们没散，也没完全回到从前。考研结束那天，他按了按你笔帽：「……别随便说走。」你没接话。（这一场风波，你填了 '+reviewed+' 个词）', cls:'be'};
  return {tag:'风波 · 散场', title:'没人留住谁', body:'那天的误会没真正说开。沈确 真的撤了，周屿 没留住你，你也没留住沈确。很多年后你才想起，沈确 最后推过来的那个词是 distance——他早就在用那个词，量你们之间的距离。（这一场风波，你填了 '+reviewed+' 个词）', cls:'be'};
}
function resolveGirl(){
  const n=net();
  if(n>=3) return {tag:'误会 · 解开', title:'原来是自己点的火', body:'林晚 还是会出现，还是甜，还是主动——但你已经不慌了。沈确 偶尔被她拉去讲题，你就在旁边翻白眼，他回头冲你挑一下眉，你别过脸，嘴角却弯了。\n后来你当着他的面，跟林晚 说「他归我管」。她笑：「知道啦，早看出来了。」那场由你亲手点起来的火，被你亲手按灭。（这一场误会，你填了 '+reviewed+' 个词）', cls:'he'};
  if(n>=-1) return {tag:'误会 · 余震', title:'留了个小疙瘩', body:'话是说开了，可你偶尔还会想起他递伞那下，心里微微发涩。沈确 没再提林晚，只是每次有人凑过来，他会下意识往你这边靠半寸。你们没散，也没完全回到从前——介意的，好像只有你一个。（这一场误会，你填了 '+reviewed+' 个词）', cls:'be'};
  return {tag:'误会 · 散场', title:'火没灭干净', body:'你赌的气，到底没全消。林晚 还在他身边出现，你每次看见都像被刺一下，又总憋着不说。沈确 钝，察觉了也只会闷头背词。很多年后你才想起，那场误会里你卡住的词是 jealous——你早就在用那个词，称量自己有多在意他。（这一场误会，你填了 '+reviewed+' 个词）', cls:'be'};
}
function resolveBoth(){
  const n=net();
  if(n>=3) return {tag:'合流 · 稳住', title:'两边都按灭了', body:'周屿 订了回老家的票，走前拍你肩「好好的」；林晚 也退成了普通同学，再见你俩就眨眨眼溜走。你长出一口气，对 沈确 说「别走，也别多想」——他「嗯」了声，把那支总掉笔帽的笔，轻轻按进你手里。\n这一周乱糟糟的火，被你一手一手按灭。窗外的天快黑了，你们谁都没急着走。（这一场合流，你填了 '+reviewed+' 个词）', cls:'he'};
  if(n>=-1) return {tag:'合流 · 余震', title:'留了两根刺', body:'话说开了大半，可 周屿 的「回老家」和 林晚 的「存在」，像两根没拔干净的刺。沈确 没再提他俩，只是偶尔留位子时，多留半寸距离。你们没散，也没完全回到从前——介意的，好像还是只有你。（这一场合流，你填了 '+reviewed+' 个词）', cls:'be'};
  return {tag:'合流 · 散场', title:'两头都没按住', body:'你两头都没按住：周屿 没留住你，也没真走成；沈确 被 林晚 的误会和你的赌气，一点点推开。很多年后你才想起，那一周你卡住的词是 balance——你早就在用那个词，称量自己到底站哪边。（这一场合流，你填了 '+reviewed+' 个词）', cls:'be'};
}
function resolveGrad(){
  const n=net();
  if(n>=3) return {tag:'读研后 · 安稳', title:'灯还亮着', body:'你们真的在那间有窗的房子里，过了一年又一年。他还是不会说好听的话，还是会按笔帽，还是会在你卡词时把本子推过来。\n只是现在，那个靠窗的位子旁边，永远坐的是你。考研那年的弦松了，可有些东西，反倒更紧了。（这一章读研后，你填了 '+reviewed+' 个词）', cls:'he'};

/* ============ 通用答题（四种题型，支持指定 pack / 指定词） ============ */
function askWord(onAnswer, isStory, pack, force, ctx){
  let word = force;
  if(word && !Array.isArray(word)) word = findWord(word);
  if(!word || !word[0]){
    let list = pack ? packList(pack) : BANK;
    if(gSrc!=='all' && isStory){
      if(gSrc==='high') list=list.filter(w=>BANK.indexOf(w)<BANK.length/3);
      else if(gSrc==='mid') list=list.filter(w=>{const i=BANK.indexOf(w); return i>=BANK.length/3 && i<2*BANK.length/3;});
      else if(gSrc==='low') list=list.filter(w=>BANK.indexOf(w)>=2*BANK.length/3);
      else if(gSrc==='wrong'){ const pp=loadP(); list=list.filter(w=>pp.words[w[0]]&&pp.words[w[0]].w>0); }
      else if(gSrc==='custom') list=(loadP().custom||[]);
      if(!list.length) list=packList(pack);
    }
    if(!list.length){ root.innerHTML=`<div class="scene"><div class="txt">当前词源暂时没有词。</div></div>`; return; }
    word=list[Math.floor(Math.random()*list.length)];
  }
  let type;
  if(storyCloze(word)){ type='cloze'; } // 有剧情语境句 → 必出剧情填空，让背的词和你看过的剧情走在一块
  else {
    let types=['choice','spell','listen','cloze'];
    type=types[Math.floor(Math.random()*types.length)];
    if(type==='listen' && !('speechSynthesis' in window)) type='choice';
    if(type==='cloze' && !clozeReal(word)) type='choice'; // 无真实例句则回退，绝不出现模板别扭句
  }

  const ctxHtml = (ctx && (ctx.who || ctx.text))
    ? `<div class="who">${ctx.who||''}</div><div class="txt tw">${(ctx.text||'').replace(/\n/g,'<br>')}</div>`
    : '';

  const head = isStory
    ? scaleHTML()+`<div class="scene">${ctxHtml}`
    : `<div class="prog"><div class="stat">背词中</div><div class="stat"><b>${unmastered().length}</b>未掌握</div></div><div class="scene">${ctxHtml}`;
  const favBtn = `<button class="choice fav-btn ${isFav(word[0])?'fav-on':''}" onclick="favToggle(this,'${word[0].replace(/'/g,"\\'")}')">${isFav(word[0])?'⭐ 已收藏':'⭐ 收藏'}</button>`;
  const tail = isStory
    ? `<div class="choices"><button class="choice" onclick="window._cur=null;renderMenu()">← 返回首页</button>${favBtn}</div>${sStats()}</div>`
    : `<div class="choices" style="margin-top:10px"><button class="choice" onclick="window._cur=null;renderMenu()">← 返回首页</button>${favBtn}</div></div>`;

  window._cur={word,onAnswer,type};

  if(type==='choice' || type==='listen'){
    const opts=shuffle([word[2], ...distract(word[0])]);
    const speakBtn = `<button class="speak" onclick="speak('${word[0].replace(/'/g,"\\'")}')">🔊 ${type==='listen'?'播放发音':'点读单词'}</button>`;
    root.innerHTML=head+`<span class="qtype">${type==='listen'?'听音选义':'选择题'}</span>
      <div class="wordcard"><div class="en">${type==='listen'?'🔊 听发音':word[0]}</div><div class="ph">${word[1]}</div></div>
      ${speakBtn}
      <div class="txt" style="text-align:center;color:var(--dim);font-size:13px;margin-bottom:6px">选出正确中文释义</div>
      <div class="choices" id="opts">${opts.map((o,i)=>`<button class="choice" id="o${i}" onclick="ansChoice('${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')}</div>
      <div class="fb" id="fb"></div><div class="choices" id="cont" style="display:none"></div>`+tail;
    if(type==='listen') setTimeout(function(){ speak(word[0]); }, 300);
  }
  else if(type==='spell'){
    root.innerHTML=head+`<span class="qtype">拼写题</span>
      <div class="wordcard"><div class="ph">${word[1]}</div><div class="zh">释义：${word[2]}</div></div>
      <button class="speak" onclick="speak('${word[0].replace(/'/g,"\\'")}')">🔊 点读单词</button>
      <div class="txt" style="text-align:center;color:var(--dim);font-size:13px;margin:8px 0">根据音标与释义，拼写出英文单词</div>
      <input class="qinput" id="ans" placeholder="输入英文…" autocomplete="off">
      <button class="qbtn" onclick="ansText()">提交</button>
      <div class="fb" id="fb"></div><div class="choices" id="cont" style="display:none"></div>`+tail;
    setTimeout(function(){ const e=document.getElementById('ans'); if(e) e.focus(); },100);
  }
  else {
    const sent=(cloze(word)||'___').split('｜');
    const blankHtml = sent[0].replace(/〔[^〕]*〕/g,'<span class="blank">＿＿＿＿＿</span>'); // 把〔 〕挖空换成醒目的高亮空位
    root.innerHTML=head+`<span class="qtype">剧情填空</span>
      <div class="wordcard"><div class="zh" style="font-size:15px;line-height:1.7">${blankHtml}</div><div style="font-size:12.5px;color:var(--dim);margin-top:6px">${sent[1]||''}</div></div>
      <button class="speak" onclick="speak('${word[0].replace(/'/g,"\\'")}')">🔊 点读单词</button>
      <input class="qinput" id="ans" placeholder="在空格处填入单词原形…" autocomplete="off">
      <button class="qbtn" onclick="ansText()">提交</button>
      <div class="fb" id="fb"></div><div class="choices" id="cont" style="display:none"></div>`+tail;
    setTimeout(function(){ const e=document.getElementById('ans'); if(e) e.focus(); },100);
  }
}
function ansChoice(o){
  const c=window._cur; if(!c) return;
  const ok=(o===c.word[2]);
  const box=document.getElementById('opts');
  [...box.children].forEach(b=>{ b.disabled=true; if(b.textContent===c.word[2]) b.classList.add('ok'); else if(b.textContent===o) b.classList.add('no'); });
  const fb=document.getElementById('fb'); const _pool=(curView!=='story'&&modeFB)?(ok?modeFB.good:modeFB.bad):(ok?GOOD_FB:BAD_FB); fb.textContent=pickFB(_pool); fb.className=ok?'fb good':'fb bad';
  if(ok) sfxGood(); else sfxBad();
  if(curView==='story') finish(c, ok); else revealContinue(ok);
}
function ansText(){
  const c=window._cur; if(!c) return;
  const v=document.getElementById('ans').value;
  const ok=(norm(v)===norm(c.word[0]));
  const fb=document.getElementById('fb');
  const wc=document.querySelector('.wordcard');
  const inp=document.getElementById('ans'); const btn=document.querySelector('.qbtn');
  if(inp) inp.disabled=true; if(btn) btn.disabled=true;
  if(ok){ const _pool=(curView!=='story'&&modeFB)?modeFB.good:GOOD_FB; fb.textContent=pickFB(_pool); fb.className='fb good'; if(wc) wc.classList.add('ok'); sfxGood(); }
  else { const _pool=(curView!=='story'&&modeFB)?modeFB.bad:BAD_SPELL_FB; fb.textContent='✘ 正确拼写是「'+c.word[0]+'」。'+pickFB(_pool); fb.className='fb bad'; if(wc) wc.classList.add('no'); sfxBad(); }
  if(curView==='story') finish(c, ok); else revealContinue(ok);
}
function revealContinue(ok, feedback){
  const cont=document.getElementById('cont');
  if(cont){ 
    const fbHtml = feedback ? `<div class="txt tw" style="font-size:13.5px;line-height:1.7;color:var(--ink2);margin:6px 0 10px">${feedback}</div>` : '';
    cont.style.display='block'; 
    cont.innerHTML=fbHtml+`<div class="choices"><button class="choice" onclick="finish(window._cur, ${ok})">继续 →</button></div>`; 
  }
}
function finish(c, ok){ record(c.word[0], ok); c.onAnswer(ok, c.word); }

  const s2=stat(); const p=loadP();

  root.innerHTML=`<div class="topbar"><button onclick="renderMenu()">主菜单</button><button onclick="renderDaily()">陪他夜读</button><button class="on">进度</button></div>
    <div class="scene">
      <div class="who">【我的进度】</div>
      <div class="prog"><div class="stat"><b>${s2.mastered}</b>已掌握</div><div class="stat"><b>${dueCount()}</b>待复习</div><div class="stat"><b>${s2.wrong}</b>易错</div><div class="stat"><b>${s2.total}</b>累计接触</div><div class="stat"><b>${p.frag||0}</b>碎片</div></div>
      <div class="txt" style="font-size:13px;color:var(--dim);margin:6px 0 4px">「已掌握」= 累计答对3次且无错；「待复习」= 已学过、按遗忘曲线到该复习的词；「易错」= 曾答错过的词（去「他的错题本」专测）。所有背词都发生在剧情/夜读/错题本里，没有脱离剧情的纯刷题。</div>
      <div class="sec-title">词库主题分布</div>
      <div class="pack-chips">${Object.keys(PACK_DEFS).map(k=>`<span class="chip">${PACK_DEFS[k].name}</span>`).join('')}<span class="chip chip-ghost">通用</span></div>
      <div class="txt" style="font-size:12.5px;color:var(--dim);margin-top:5px">剧情里的单词关按章节主题从这 6 类里抽词，让背的词和故事氛围对得上；其余词都归进「通用」大池子，靠夜读和错题本慢慢覆盖。</div>
      <div class="txt" style="font-size:13px;font-weight:600;margin-top:10px">易错词预览（最多40）：</div>
      <div class="txt" style="font-size:12.5px;line-height:1.8;margin-top:4px">${wrongList.length?wrongList.join('<br>'):'暂无易错词，去答题吧～'}</div>
      <div class="choices" style="margin-top:14px">
        <button class="choice" onclick="renderChapterTask()">▶ 去测他的错题本</button>
        <button class="choice" onclick="if(confirm('确定清空所有进度？')){localStorage.removeItem(PK);renderStats();}">清空进度</button>
        <button class="choice" onclick="renderMenu()">返回菜单</button>
      </div>
    </div>`;
}

/* ============ 导入专属词表 ============ */
function renderImport(){
  curView='import';
  root.innerHTML=`<div class="topbar"><button onclick="renderMenu()">主菜单</button><button onclick="renderDaily()">陪他夜读</button><button onclick="renderStats()">进度</button></div>
    <div class="scene">
      <div class="who">【导入专属词表】</div>
      <div class="txt" style="font-size:13px;color:var(--dim);margin-bottom:8px">每行一个词，格式：「英文 中文」，例如：\n  affection 喜爱；感情\n  alleviate 减轻，缓和\n也可只写英文（释义留空）。保存后在剧情/夜读里选「导入」词源使用。</div>
      <textarea id="imp" placeholder="affection 喜爱；感情&#10;alleviate 减轻，缓和"></textarea>
      <div class="choices" style="margin-top:10px">
        <button class="choice" onclick="doImport()">保存并返回菜单</button>
        <button class="choice" onclick="renderMenu()">返回</button>
      </div>
    </div>`;
}
function doImport(){
  const p=loadP(); p.custom=[];
  const lines=(document.getElementById('imp').value||'').split('\n');
  for(let ln of lines){ ln=ln.trim(); if(!ln) continue;
    let en, zh='';
    if(ln.indexOf('\t')>=0){ const a=ln.split('\t'); en=a[0].trim(); zh=a.slice(1).join(' ').trim(); }
    else { const i=ln.indexOf(' '); if(i>0){ en=ln.slice(0,i).trim(); zh=ln.slice(i+1).trim(); } else en=ln; }
    if(en) p.custom.push([en,'',zh]);
  }
  saveP(p); gSrc='custom'; renderMenu();
}

renderCover();
